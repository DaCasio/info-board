<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Monitor - Orbital View</title>
    <style>
        :root { --accent: #00cae3; --bg-overlay: rgba(0, 0, 0, 0.8); --live-color: #ffcc00; }
        
        body { 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images-assets.nasa.gov/image/PIA08653/PIA08653~medium.jpg');
            background-size: cover; background-attachment: fixed; background-position: center;
            color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0;
        }

        .header { text-align: center; text-transform: uppercase; letter-spacing: 8px; margin-bottom: 30px; border-bottom: 1px solid var(--accent); padding-bottom: 10px; }

        /* Das 2-Spalten-Grid für optimale Dashboard-Nutzung */
        #liste { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            max-width: 1400px; 
            margin: 0 auto;
        }

        .termin-card { 
            background: rgba(20, 20, 20, 0.9); 
            backdrop-filter: blur(10px);
            border-left: 5px solid var(--accent); 
            border-right: 1px solid rgba(0, 202, 227, 0.2);
            padding: 15px; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .titel-box { font-size: 1.25em; font-weight: bold; margin-bottom: 6px; color: white; }

        /* TAG STYLING */
        .tag-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .tag-pill { 
            font-size: 0.6em; 
            background: rgba(0, 202, 227, 0.1); 
            color: var(--accent); 
            padding: 2px 8px; 
            border-radius: 4px; 
            text-transform: uppercase; 
            border: 1px solid rgba(0, 202, 227, 0.4);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .info-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        
        .datum-box { font-size: 0.8em; color: #aaa; }
        
        .countdown { 
            font-family: 'Courier New', monospace; 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 0.95em;
            background: rgba(0, 202, 227, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 202, 227, 0.2);
        }

        .notiz-box { 
            font-size: 0.85em; 
            color: #ccc; 
            margin: 5px 0 15px 0; 
            line-height: 1.4; 
            max-height: 80px; 
            overflow: hidden; 
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            font-style: italic;
        }

        /* Status-Farben */
        .faellig .countdown { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); border-color: #ff4d4d; }
        .faellig { border-left-color: #ff4d4d; }
        
        .laufend .countdown { color: var(--live-color); background: rgba(255, 204, 0, 0.1); border-color: var(--live-color); }
        .laufend { border-left-color: var(--live-color); }

        @media (max-width: 1000px) { #liste { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header"><h1>Orbital Display Monitor</h1></div>
    <div id="liste">Initialisiere Deep Space Link...</div>

<script>
    const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
    const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
    const G_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';
    let data = [];

    async function load() {
        try {
            const res = await fetch(G_URL, { headers: { 'Authorization': `token ${t1+t2}` }, cache: "no-store" });
            if(res.ok) {
                const j = await res.json();
                data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content), c => c.charCodeAt(0))));
                render();
            }
        } catch(e) { console.error("Orbit Sync Lost", e); }
    }

    function getCountdown(ms) {
        if (ms < 0) return "FÄLLIG";
        const d = Math.floor(ms/86400000).toString().padStart(2,'0');
        const hh = Math.floor((ms%86400000)/3600000).toString().padStart(2,'0');
        const mm = Math.floor((ms%3600000)/60000).toString().padStart(2,'0');
        const ss = Math.floor((ms%60000)/1000).toString().padStart(2,'0');
        return `${d}d ${hh}:${mm}:${ss}`;
    }

    function render() {
        const jetzt = new Date();
        // ARCHIV herausfiltern für das Display
        const filtered = data.filter(t => !t.tags || !t.tags.includes("ARCHIV"));
        
        filtered.sort((a, b) => new Date(a.ziel) - new Date(b.ziel));

        let h = "";
        filtered.forEach(t => {
            const ziel = new Date(t.ziel), start = t.start ? new Date(t.start) : null;
            let statusClass = "";
            let timerText = "";

            if (start && jetzt < start) {
                timerText = "START: " + getCountdown(start - jetzt);
            } else if (jetzt < ziel) {
                statusClass = start ? "laufend" : "";
                timerText = getCountdown(ziel - jetzt);
            } else {
                statusClass = "faellig";
                timerText = "ÜBERFÄLLIG";
            }

            // Tags generieren (alle außer Archiv)
            const tagsHtml = t.tags ? t.tags.filter(tag => tag !== "ARCHIV").map(tag => `<span class="tag-pill">${tag}</span>`).join('') : '';
            
            // Notiz säubern (Markdown-Tags entfernen)
            const cleanNote = t.notiz ? t.notiz.replace(/\[.*?\]/g, '').replace(/\*\*/g, '').replace(/--/g, '').substring(0, 120) : '';

            h += `
            <div class="termin-card ${statusClass}">
                <div class="titel-box">${t.name}</div>
                <div class="tag-row">${tagsHtml}</div>
                <div class="notiz-box">${cleanNote}${cleanNote.length >= 120 ? '...' : ''}</div>
                <div class="info-row">
                    <div class="datum-box">${new Date(t.ziel).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
                    <div class="countdown">${timerText}</div>
                </div>
            </div>`;
        });
        document.getElementById('liste').innerHTML = h || "KEINE AKTIVEN TERMINE";
    }

    load();
    setInterval(load, 60000); 
    setInterval(render, 1000); 
</script>
</body>
</html>
