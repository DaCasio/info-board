<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Monitor - Dual Orbital View</title>
    <style>
        :root { --accent: #00cae3; --bg-overlay: rgba(0, 0, 0, 0.85); --live-color: #ffcc00; }
        
        body { 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images-assets.nasa.gov/image/PIA08653/PIA08653~medium.jpg');
            background-size: cover; background-attachment: fixed; background-position: center;
            color: white; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0;
            overflow-x: hidden;
        }

        .header { 
            text-align: center; text-transform: uppercase; letter-spacing: 6px; 
            margin-bottom: 20px; border-bottom: 2px solid var(--accent); 
            padding-bottom: 5px; font-size: 0.9em; opacity: 0.8;
        }

        /* 2-Spalten-Grid System */
        #liste { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            max-width: 100%; 
            margin: 0 auto;
        }

        .termin-card { 
            background: rgba(15, 15, 15, 0.9); 
            backdrop-filter: blur(12px);
            border-left: 5px solid var(--accent); 
            border-radius: 6px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            height: 160px; /* Feste Höhe für Gleichmäßigkeit */
            position: relative;
        }

        .titel-box { 
            font-size: 1.1em; font-weight: bold; color: white;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        /* Tag-Zeile */
        .tag-row { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; height: 22px; overflow: hidden; }
        .tag-pill { 
            font-size: 0.6em; 
            background: rgba(0, 202, 227, 0.1); 
            color: var(--accent); 
            padding: 2px 8px; 
            border-radius: 3px; 
            text-transform: uppercase; 
            border: 1px solid rgba(0, 202, 227, 0.4);
            font-weight: bold;
        }

        .notiz-box { 
            font-size: 0.8em; 
            color: #bbb; 
            line-height: 1.3; 
            overflow: hidden; 
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Max 3 Zeilen Notiz */
            -webkit-box-orient: vertical;
            margin-bottom: 10px;
        }

        .info-row { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: auto; padding-top: 8px; 
            border-top: 1px solid rgba(255,255,255,0.1); 
        }
        
        .datum-box { font-size: 0.75em; color: #888; font-weight: bold; }
        
        .countdown { 
            font-family: 'Courier New', monospace; 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 0.85em;
            background: rgba(0, 202, 227, 0.15);
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 202, 227, 0.2);
        }

        /* Status-Zustände */
        .faellig { border-left-color: #ff4d4d; }
        .faellig .countdown { color: #ff4d4d; background: rgba(255, 77, 77, 0.15); border-color: #ff4d4d; }
        
        .laufend { border-left-color: var(--live-color); }
        .laufend .countdown { color: var(--live-color); background: rgba(255, 204, 0, 0.15); border-color: var(--live-color); }

        /* Responsive: Auf Handys zurück zu 1 Spalte */
        @media (max-width: 800px) { 
            #liste { grid-template-columns: 1fr; }
            .termin-card { height: auto; min-height: 140px; }
        }
    </style>
</head>
<body>

    <div class="header">Orbital Monitor - Dual Sync Mode</div>
    <div id="liste">Verbinde mit Satellit...</div>

<script>
    const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
    const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
    const G_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';
    let data = [];

    async function load() {
        try {
            const res = await fetch(G_URL, { headers: { 'Authorization': `token ${t1+t2}` }, cache: "no-store" });
            if(res.ok) {
                const j = await res.json();
                data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content), c => c.charCodeAt(0))));
                render();
            }
        } catch(e) { console.error("Communication Interrupted", e); }
    }

    function getCountdown(ms) {
        if (ms < 0) return "00d 00:00:00";
        const d = Math.floor(ms/86400000).toString().padStart(2,'0');
        const hh = Math.floor((ms%86400000)/3600000).toString().padStart(2,'0');
        const mm = Math.floor((ms%3600000)/60000).toString().padStart(2,'0');
        const ss = Math.floor((ms%60000)/1000).toString().padStart(2,'0');
        return `${d}d ${hh}:${mm}:${ss}`;
    }

    function render() {
        const jetzt = new Date();
        const filtered = data.filter(t => !t.tags || !t.tags.includes("ARCHIV"));
        
        filtered.sort((a, b) => new Date(a.ziel) - new Date(b.ziel));

        let h = "";
        filtered.forEach(t => {
            const ziel = new Date(t.ziel), start = t.start ? new Date(t.start) : null;
            let statusClass = "";
            let timerText = "";

            if (start && jetzt < start) {
                timerText = "IN: " + getCountdown(start - jetzt);
            } else if (jetzt < ziel) {
                statusClass = start ? "laufend" : "";
                timerText = getCountdown(ziel - jetzt);
            } else {
                statusClass = "faellig";
                timerText = "OVERDUE";
            }

            const tagsHtml = t.tags ? t.tags.map(tag => `<span class="tag-pill">${tag}</span>`).join('') : '';
            // Entferne Markdown und Checkboxen für die reine Anzeige
            const cleanNote = t.notiz.replace(/\[.*?\]/g, '').replace(/\*\*/g, '').replace(/--/g, '');

            h += `
            <div class="termin-card ${statusClass}">
                <div class="titel-box">${t.name}</div>
                <div class="tag-row">${tagsHtml}</div>
                <div class="notiz-box">${cleanNote}</div>
                <div class="info-row">
                    <div class="datum-box">${new Date(t.ziel).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit'})}</div>
                    <div class="countdown">${timerText}</div>
                </div>
            </div>`;
        });
        document.getElementById('liste').innerHTML = h || "SYSTEM CLEAR - NO PENDING DATA";
    }

    load();
    setInterval(load, 60000); 
    setInterval(render, 1000); 
</script>
</body>
</html>
