<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Monitor - E-Ink Grid Full-Text</title>
    <style>
        body { 
            background-color: white; 
            color: black; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 15px; 
            margin: 0; 
        }

        h1 { 
            border-bottom: 5px solid #00cae3; 
            padding-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            text-align: center;
            font-size: 2.2em; /* Größerer Header */
            margin: 0 0 10px 0;
        }
        
        .termin-counter { 
            text-align: right; 
            font-weight: bold; 
            color: #00cae3;
            margin-bottom: 12px;
            font-size: 1.1em;
        }

        #liste { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            align-items: start; /* Erlaubt unterschiedliche Höhen */
        }

        .termin-card { 
            border: 3px solid black; /* Dickere Ränder für E-Ink Kontrast */
            padding: 12px; 
            background-color: #fdfdfd;
            display: flex;
            flex-direction: column;
            height: auto; /* Box wächst mit dem Inhalt */
            min-height: 160px;
        }

        .card-urgent { border-color: #ff4d4d; background-color: #fffafa; border-width: 4px; }
        .card-running { border-color: #ffcc00; background-color: #fffff0; }
        
        .termin-name { 
            font-size: 1.4em; /* Deutlich größer */
            font-weight: bold; 
            line-height: 1.2;
            margin-bottom: 6px;
            word-break: break-word; /* Verhindert Überlaufen bei langen Wörtern */
        }
        
        .tag-container { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .tag-badge { 
            border: 1px solid black; 
            background-color: #e0faff; 
            padding: 2px 8px; 
            font-size: 0.8em; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        .termin-datum { 
            font-size: 1.0em; /* Größeres Datum */
            color: #222; 
            line-height: 1.4;
            margin-bottom: 10px;
            font-weight: 500;
        }

        /* Notizen-Bereich: Kein Limit mehr */
        .notiz-box {
            font-size: 1.0em; /* Fast so groß wie Standardtext */
            color: #333;
            border-top: 2px solid #eee;
            margin-top: 8px;
            padding-top: 8px;
            white-space: pre-wrap;
            line-height: 1.4;
            overflow: visible; /* Zeigt alles an */
        }

        .zeit-box { 
            border-top: 2px dashed #00cae3;
            padding-top: 8px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-label { font-size: 0.7em; text-transform: uppercase; color: #555; font-weight: bold; }
        .zeit { 
            font-family: 'Courier New', monospace; 
            font-size: 1.3em; 
            font-weight: bold; 
            color: #00cae3;
        }

        .cb-line { display: block; padding: 2px 0; }
        .cb-line.done { text-decoration: line-through; color: #999; }

        .faellig { color: #ff4d4d !important; }
        .urgent-text { color: #ff4d4d !important; }
        .running-text { color: #ffcc00 !important; }

        @media (max-width: 800px) {
            #liste { grid-template-columns: 1fr; } /* Schaltet früher auf 1 Spalte für Lesbarkeit */
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <h1>Termin Monitor</h1>
    <div id="counter-display" class="termin-counter">Synchronisiere...</div>
    <div id="liste">Lade Daten...</div>

    <script>
        const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
        const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
        const GITHUB_TOKEN = t1 + t2;
        const GITHUB_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';

        let termineDaten = [];

        async function holeDaten() {
            try {
                const response = await fetch(GITHUB_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: "no-store"
                });
                if (response.ok) {
                    const data = await response.json();
                    const str = atob(data.content);
                    const bytes = new Uint8Array(str.length);
                    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
                    termineDaten = JSON.parse(new TextDecoder().decode(bytes));
                    updateAnzeige();
                }
            } catch (e) { console.error("Sync Error"); }
        }

        function getCountdownStr(ms) {
            if (ms < 0) return "FÄLLIG";
            const d = Math.floor(ms/86400000);
            const h = Math.floor((ms%86400000)/3600000);
            return d + "t " + h + "std";
        }

        function formatNotiz(txt) {
            if (!txt) return "";
            return txt.split('\n').map(line => {
                if (line.startsWith('[ ]')) return '<span class="cb-line">☐ ' + line.slice(3) + '</span>';
                if (line.startsWith('[x]')) return '<span class="cb-line done">☑ ' + line.slice(3) + '</span>';
                return line;
            }).join('\n')
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/--(.*?)--/g, '<s>$1</s>');
        }

        function updateAnzeige() {
            const listeDiv = document.getElementById('liste');
            const counterDiv = document.getElementById('counter-display');
            const jetzt = new Date();

            const sichtbare = termineDaten.filter(t => !t.tags || !t.tags.includes("ARCHIV"));
            counterDiv.innerText = "AKTIVE TERMINE: " + sichtbare.length;

            sichtbare.sort((a, b) => new Date(a.ziel) - new Date(b.ziel));

            let html = "";
            sichtbare.forEach((t) => {
                const ziel = new Date(t.ziel);
                const start = t.start ? new Date(t.start) : null;
                let zeitStr = "", statusText = "", cardClass = "", zeitClass = "";

                if (start && jetzt < start) {
                    statusText = "STARTET"; zeitStr = getCountdownStr(start - jetzt);
                } else if (jetzt < ziel) {
                    statusText = start ? "ENDET" : "NOCH"; zeitStr = getCountdownStr(ziel - jetzt);
                    if (start) { cardClass = "card-running"; zeitClass = "running-text"; }
                    else if (ziel - jetzt < 86400000) { cardClass = "card-urgent"; zeitClass = "urgent-text"; }
                } else {
                    statusText = "STATUS"; zeitStr = "FÄLLIG"; cardClass = "card-urgent"; zeitClass = "faellig";
                }
                
                let tagsHtml = "";
                if (t.tags && t.tags.length > 0) {
                    tagsHtml = '<div class="tag-container">' + 
                        t.tags.map(tag => '<span class="tag-badge">' + tag + '</span>').join('') + 
                        '</div>';
                }

                const dOpt = { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' };
                let zeitAnzeige = start ? "S: " + start.toLocaleString('de-DE', dOpt) + " | E: " + ziel.toLocaleString('de-DE', dOpt) 
                                        : "Ende: " + ziel.toLocaleString('de-DE', dOpt);

                let notizHtml = t.notiz ? '<div class="notiz-box">' + formatNotiz(t.notiz) + '</div>' : "";

                html += '<div class="termin-card ' + cardClass + '">' +
                            '<div style="flex-grow:1">' +
                                '<div class="termin-name">' + t.name + '</div>' +
                                tagsHtml +
                                '<div class="termin-datum">' + zeitAnzeige + '</div>' +
                                notizHtml +
                            '</div>' +
                            '<div class="zeit-box">' +
                                '<span class="status-label">' + statusText + '</span>' +
                                '<div class="zeit ' + zeitClass + '">' + zeitStr + '</div>' +
                            '</div>' +
                        '</div>';
            });
            listeDiv.innerHTML = html;
        }

        holeDaten();
        setInterval(holeDaten, 60000);
        setInterval(updateAnzeige, 60000);
    </script>
</body>
</html>
