<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Monitor - Color E-Ink (View Only)</title>
    <style>
        /* Optimiert für Color E-Ink: Klare Farben, kein Glow, kein Gradient */
        body { 
            background-color: white; 
            color: black; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            margin: 0; 
        }

        h1 { 
            border-bottom: 6px solid #00cae3; 
            padding-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            text-align: center;
            font-size: 2.5em;
            color: black;
            margin-top: 0;
        }
        
        .termin-counter { 
            text-align: right; 
            font-weight: bold; 
            color: #00cae3;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .termin-card { 
            border: 3px solid black;
            margin: 15px 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; /* Geändert für bessere Tag-Anordnung */
            background-color: #fdfdfd;
        }

        .card-urgent { border-color: #ff4d4d; background-color: #fffafa; }
        .card-running { border-color: #ffcc00; background-color: #fffff0; }
        
        /* Layout-Container für Info und Zeit nebeneinander */
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .termin-info { flex: 1; min-width: 0; }
        .termin-name { font-size: 1.6em; font-weight: bold; color: black; margin-bottom: 5px; }
        
        /* Tag-Styles für E-Ink */
        .tag-container { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .tag-badge { 
            border: 1px solid black; 
            background-color: #e0faff; /* Sehr helles Türkis für Kontrast */
            color: black; 
            padding: 2px 8px; 
            font-size: 0.8em; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        .termin-datum { font-size: 1.05em; color: #444; line-height: 1.4; font-weight: 500; }

        .notiz-text { 
            margin-top: 10px; 
            font-size: 1.1em; 
            border-top: 2px solid #00cae3; 
            padding-top: 8px;
            white-space: pre-wrap;
            color: #333;
            line-height: 1.4;
        }

        .cb-line { 
            display: block; 
            padding: 5px 0; 
            font-weight: 500; 
            pointer-events: none; 
            cursor: default; 
        }
        .cb-line.done { text-decoration: line-through; color: #888; }
        
        .zeit-box { text-align: right; margin-left: 20px; min-width: 180px; }
        .status-label { display: block; font-size: 0.75em; text-transform: uppercase; font-weight: bold; color: #666; margin-bottom: -2px; }
        .zeit { 
            font-family: 'Courier New', monospace; 
            font-size: 1.8em; 
            font-weight: bold; 
            color: #00cae3;
            white-space: nowrap;
        }

        .faellig { color: #ff4d4d !important; text-transform: uppercase; }
        .urgent-text { color: #ff4d4d !important; }
        .running-text { color: #ffcc00 !important; }
    </style>
</head>
