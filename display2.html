<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Monitor - E-Ink Grid</title>
    <style>
        body { 
            background-color: white; 
            color: black; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 15px; 
            margin: 0; 
        }

        h1 { 
            border-bottom: 4px solid #00cae3; 
            padding-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-align: center;
            font-size: 1.8em;
            margin: 0 0 10px 0;
        }
        
        .termin-counter { 
            text-align: right; 
            font-weight: bold; 
            color: #00cae3;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        /* Das Grid-System */
        #liste { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* 2 Spalten */
            gap: 12px; 
        }

        .termin-card { 
            border: 2px solid black;
            padding: 10px; 
            background-color: #fdfdfd;
            display: flex;
            flex-direction: column;
            justify-content:间-between;
            min-height: 120px; /* Einheitliche Höhe für schöneres Grid */
        }

        .card-urgent { border-color: #ff4d4d; background-color: #fffafa; border-width: 3px; }
        .card-running { border-color: #ffcc00; background-color: #fffff0; }
        
        .termin-name { 
            font-size: 1.2em; 
            font-weight: bold; 
            line-height: 1.2;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Max 2 Zeilen Titel */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .tag-container { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
        .tag-badge { 
            border: 1px solid black; 
            background-color: #e0faff; 
            padding: 0px 4px; 
            font-size: 0.65em; 
            font-weight: bold; 
        }

        .termin-datum { font-size: 0.85em; color: #444; margin-bottom: 8px; flex-grow: 1; }

        .zeit-box { 
            border-top: 1px dashed #ccc;
            padding-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-label { font-size: 0.6em; text-transform: uppercase; color: #666; }
        .zeit { 
            font-family: 'Courier New', monospace; 
            font-size: 1.2em; 
            font-weight: bold; 
            color: #00cae3;
        }

        .notiz-text { 
            font-size: 0.85em; 
            background: #f0f0f0;
            padding: 5px;
            margin-top: 5px;
            border-radius: 2px;
            max-height: 60px;
            overflow: hidden;
        }

        .faellig { color: #ff4d4d !important; }
        .urgent-text { color: #ff4d4d !important; }
        .running-text { color: #ffcc00 !important; }

        /* Mobile Optimierung: Falls das Display sehr schmal ist */
        @media (max-width: 600px) {
            #liste { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>Termin Monitor</h1>
    <div id="counter-display" class="termin-counter">Lade...</div>
    <div id="liste">Orbit wird gescannt...</div>

    <script>
        const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
        const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
        const GITHUB_TOKEN = t1 + t2;
        const GITHUB_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';

        let termineDaten = [];

        async function holeDaten() {
            try {
                const response = await fetch(GITHUB_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: "no-store"
                });
                if (response.ok) {
                    const data = await response.json();
                    const str = atob(data.content);
                    const bytes = new Uint8Array(str.length);
                    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
                    termineDaten = JSON.parse(new TextDecoder().decode(bytes));
                    updateAnzeige();
                }
            } catch (e) { console.error("Sync Error"); }
        }

        function getCountdownStr(ms) {
            if (ms < 0) return "FÄLLIG";
            const d = Math.floor(ms/86400000);
            const h = Math.floor((ms%86400000)/3600000);
            const m = Math.floor((ms%3600000)/60000);
            return d + "d " + h + "h"; // Gekürzt für Grid
        }

        function updateAnzeige() {
            const listeDiv = document.getElementById('liste');
            const counterDiv = document.getElementById('counter-display');
            const jetzt = new Date();

            const sichtbare = termineDaten.filter(t => !t.tags || !t.tags.includes("ARCHIV"));
            counterDiv.innerText = "AKTIV: " + sichtbare.length;

            sichtbare.sort((a, b) => new Date(a.ziel) - new Date(b.ziel));

            let html = "";
            sichtbare.forEach((t) => {
                const ziel = new Date(t.ziel);
                const start = t.start ? new Date(t.start) : null;
                let zeitStr = "", statusText = "", cardClass = "", zeitClass = "";

                if (start && jetzt < start) {
                    statusText = "START"; zeitStr = getCountdownStr(start - jetzt);
                } else if (jetzt < ziel) {
                    statusText = "ENDE"; zeitStr = getCountdownStr(ziel - jetzt);
                    if (start) { cardClass = "card-running"; zeitClass = "running-text"; }
                    else if (ziel - jetzt < 86400000) { cardClass = "card-urgent"; zeitClass = "urgent-text"; }
                } else {
                    statusText = "STATUS"; zeitStr = "FÄLLIG"; cardClass = "card-urgent"; zeitClass = "faellig";
                }
                
                let tagsHtml = "";
                if (t.tags && t.tags.length > 0) {
                    tagsHtml = '<div class="tag-container">' + 
                        t.tags.slice(0, 3).map(tag => '<span class="tag-badge">' + tag + '</span>').join('') + 
                        '</div>';
                }

                const dOpt = { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' };
                const zielHtml = ziel.toLocaleString('de-DE', dOpt);

                html += '<div class="termin-card ' + cardClass + '">' +
                            '<div>' +
                                '<div class="termin-name">' + t.name + '</div>' +
                                tagsHtml +
                                '<div class="termin-datum">Bis: ' + zielHtml + '</div>' +
                            '</div>' +
                            '<div class="zeit-box">' +
                                '<span class="status-label">' + statusText + '</span>' +
                                '<div class="zeit ' + zeitClass + '">' + zeitStr + '</div>' +
                            '</div>' +
                        '</div>';
            });
            listeDiv.innerHTML = html;
        }

        holeDaten();
        setInterval(holeDaten, 60000);
    </script>
</body>
</html>
