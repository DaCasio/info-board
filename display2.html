<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Monitor - Orbital Grid</title>
    <style>
        :root { --accent: #00cae3; --bg-overlay: rgba(0, 0, 0, 0.85); --live-color: #ffcc00; }
        
        body { 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images-assets.nasa.gov/image/PIA08653/PIA08653~medium.jpg');
            background-size: cover; background-attachment: fixed; background-position: center;
            color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0;
            overflow-x: hidden;
        }

        .header { 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 8px; 
            margin-bottom: 25px; 
            border-bottom: 2px solid var(--accent); 
            padding-bottom: 10px;
            text-shadow: 0 0 10px var(--accent);
        }

        /* 2-Spalten-Grid Layout */
        #liste { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            max-width: 1600px; 
            margin: 0 auto;
        }

        .termin-card { 
            background: rgba(15, 15, 15, 0.9); 
            backdrop-filter: blur(12px);
            border-left: 6px solid var(--accent); 
            border-radius: 10px; 
            padding: 18px; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease;
        }

        .titel-box { 
            font-size: 1.4em; 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Tags Sektion */
        .tag-row { 
            display: flex; 
            gap: 6px; 
            margin-bottom: 12px; 
            flex-wrap: wrap; 
        }
        .tag-pill { 
            font-size: 0.7em; 
            background: rgba(0, 202, 227, 0.1); 
            color: var(--accent); 
            padding: 2px 10px; 
            border-radius: 4px; 
            text-transform: uppercase; 
            border: 1px solid rgba(0, 202, 227, 0.4);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .notiz-box { 
            font-size: 0.95em; 
            color: #bbb; 
            margin-bottom: 15px; 
            line-height: 1.5; 
            min-height: 60px;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Max 3 Zeilen */
            -webkit-box-orient: vertical;
            overflow: hidden;
            border-left: 2px solid rgba(255,255,255,0.1);
            padding-left: 10px;
        }

        .info-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: auto; 
            padding-top: 12px; 
            border-top: 1px solid rgba(255,255,255,0.1); 
        }
        
        .datum-box { font-size: 0.85em; color: #888; font-weight: bold; }
        
        .countdown { 
            font-family: 'Courier New', monospace; 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 1.1em;
            background: rgba(0, 202, 227, 0.15);
            padding: 6px 12px;
            border-radius: 5px;
            border: 1px solid rgba(0, 202, 227, 0.3);
            text-shadow: 0 0 5px rgba(0, 202, 227, 0.5);
        }

        /* Status-Zustände */
        .faellig { border-left-color: #ff4d4d; }
        .faellig .countdown { color: #ff4d4d; border-color: #ff4d4d; background: rgba(255, 77, 77, 0.1); }
        
        .laufend { border-left-color: var(--live-color); }
        .laufend .countdown { color: var(--live-color); border-color: var(--live-color); background: rgba(255, 204, 0, 0.1); }

        /* Responsive Fix für schmale Fenster */
        @media (max-width: 1100px) { 
            #liste { grid-template-columns: 1fr; } 
            .header { letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <div class="header"><h1>Orbital Control Display</h1></div>
    <div id="liste">Verbinde mit Satelliten-Netzwerk...</div>

<script>
    const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
    const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
    const G_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';
    let data = [];

    async function load() {
        try {
            const res = await fetch(G_URL, { headers: { 'Authorization': `token ${t1+t2}` }, cache: "no-store" });
            if(res.ok) {
                const j = await res.json();
                data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content), c => c.charCodeAt(0))));
                render();
            }
        } catch(e) { console.error("Sync Error", e); }
    }

    function getCountdown(ms) {
        if (ms < 0) return "00d 00:00:00";
        const d = Math.floor(ms/86400000).toString().padStart(2,'0');
        const hh = Math.floor((ms%86400000)/3600000).toString().padStart(2,'0');
        const mm = Math.floor((ms%3600000)/60000).toString().padStart(2,'0');
        const ss = Math.floor((ms%60000)/1000).toString().padStart(2,'0');
        return `${d}d ${hh}:${mm}:${ss}`;
    }

    function render() {
        const jetzt = new Date();
        // Archivierte ausblenden
        const filtered = data.filter(t => !t.tags || !t.tags.includes("ARCHIV"));
        
        // Sortierung: Dringlichkeit
        filtered.sort((a, b) => new Date(a.ziel) - new Date(b.ziel));

        let h = "";
        filtered.forEach(t => {
            const ziel = new Date(t.ziel), start = t.start ? new Date(t.start) : null;
            let statusClass = "";
            let timerLabel = "";
            let timerValue = "";

            if (start && jetzt < start) {
                timerLabel = "START";
                timerValue = getCountdown(start - jetzt);
            } else if (jetzt < ziel) {
                statusClass = start ? "laufend" : "";
                timerLabel = start ? "ENDE" : "";
                timerValue = getCountdown(ziel - jetzt);
            } else {
                statusClass = "faellig";
                timerLabel = "STATUS";
                timerValue = "OVERDUE";
            }

            const tagsHtml = t.tags ? t.tags.map(tag => `<span class="tag-pill">${tag}</span>`).join('') : '';
            
            // Clean Notiz (entfernt Markdown-Codes wie [x] oder [color])
            const cleanNote = t.notiz.replace(/\[.*?\]/g, '').replace(/\*\*|--/g, '');

            h += `
            <div class="termin-card ${statusClass}">
                <div class="titel-box">${t.name}</div>
                <div class="tag-row">${tagsHtml}</div>
                <div class="notiz-box">${cleanNote || 'Keine weiteren Details...'}</div>
                <div class="info-row">
                    <div class="datum-box">Target: ${new Date(t.ziel).toLocaleDateString('de-DE')}</div>
                    <div class="countdown">
                        <small style="font-size: 0.5em; display:block; text-align:center; opacity:0.7;">${timerLabel}</small>
                        ${timerValue}
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('liste').innerHTML = h || "<div style='grid-column: 1/3; text-align:center;'>KEINE AKTIVEN MISSIONEN</div>";
    }

    load();
    setInterval(load, 60000); 
    setInterval(render, 1000);
</script>
</body>
</html>
