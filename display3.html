<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Monitor - Einspaltig</title>
    <style>
        body { background-color: white; color: black; font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; margin: 0; }
        h1 { border-bottom: 6px solid #00cae3; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 4px; text-align: center; font-size: 2.5em; margin-top: 0; }
        .termin-counter { text-align: right; font-weight: bold; color: #00cae3; margin-bottom: 15px; font-size: 1.1em; }
        .termin-card { border: 3px solid black; margin: 15px 0; padding: 15px; background-color: #fdfdfd; display: block; }
        .card-urgent { border-color: #ff4d4d; background-color: #fffafa; border-width: 5px; }
        .card-running { border-color: #ffcc00; background-color: #fffff0; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .termin-info { flex: 1; }
        .termin-name { font-size: 1.8em; font-weight: bold; color: black; margin-bottom: 5px; }
        .tag-container { display: flex; gap: 6px; margin: 5px 0 10px 0; flex-wrap: wrap; }
        .tag-badge { border: 1px solid black; background-color: #e0faff; padding: 2px 8px; font-size: 0.8em; font-weight: bold; text-transform: uppercase; }
        .termin-datum { font-size: 1.1em; color: #222; line-height: 1.4; font-weight: 500; }
        .notiz-text { margin-top: 10px; font-size: 1.1em; border-top: 2px solid #00cae3; padding-top: 8px; white-space: pre-wrap; color: #333; }
        .cb-line { display: block; padding: 2px 0; }
        .cb-line.done { text-decoration: line-through; color: #888; }
        .zeit-box { text-align: right; min-width: 180px; }
        .status-label { display: block; font-size: 0.8em; text-transform: uppercase; font-weight: bold; color: #666; }
        .zeit { font-family: 'Courier New', monospace; font-size: 2em; font-weight: bold; color: #00cae3; white-space: nowrap; }
        .faellig { color: #ff4d4d !important; text-transform: uppercase; }
        .urgent-text { color: #ff4d4d !important; }
        .running-text { color: #ffcc00 !important; }
    </style>
</head>
<body>
    <h1>Termin Monitor</h1>
    <div id="counter-display" class="termin-counter">Lade...</div>
    <div id="liste">Orbit wird gescannt...</div>

    <script>
        const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
        const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
        const GITHUB_TOKEN = t1 + t2;
        const GITHUB_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';

        function getCountdownStr(ms) {
            if (ms <= 0) return "FÄLLIG";
            const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000), m = Math.floor((ms%3600000)/60000);
            let p = [];
            if (d > 0) p.push(d + "t");
            if (h > 0) p.push(h + "std");
            if (m > 0 || (d === 0 && h === 0)) p.push(m + "min");
            return p.join(" ");
        }

        function formatNotiz(txt) {
            if (!txt) return "";
            return txt.split('\n').map(line => {
                if (line.startsWith('[ ]')) return '<span class="cb-line">☐ ' + line.slice(3) + '</span>';
                if (line.startsWith('[x]')) return '<span class="cb-line done">☑ ' + line.slice(3) + '</span>';
                return line;
            }).join('\n').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/--(.*?)--/g, '<s>$1</s>');
        }

        async function holeDaten() {
            try {
                const response = await fetch(GITHUB_URL, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }, cache: "no-store" });
                if (response.ok) {
                    const data = await response.json();
                    const str = atob(data.content);
                    const bytes = new Uint8Array(str.length);
                    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
                    const termine = JSON.parse(new TextDecoder().decode(bytes));
                    updateAnzeige(termine);
                }
            } catch (e) { document.getElementById('liste').innerHTML = "Fehler!"; }
        }

        function updateAnzeige(daten) {
            const jetzt = new Date();
            const sichtbare = daten.filter(t => !t.tags || !t.tags.includes("ARCHIV"));
            document.getElementById('counter-display').innerText = "AKTIV: " + sichtbare.length;
            sichtbare.sort((a, b) => new Date(a.ziel) - new Date(b.ziel));

            let html = "";
            sichtbare.forEach(t => {
                const ziel = new Date(t.ziel), start = t.start ? new Date(t.start) : null;
                let zStr = "", sTxt = "", cCls = "", zCls = "";

                if (start && jetzt < start) { sTxt = "Startet"; zStr = getCountdownStr(start - jetzt); }
                else if (jetzt < ziel) { 
                    sTxt = start ? "Endet" : ""; zStr = getCountdownStr(ziel - jetzt);
                    if (start) { cCls = "card-running"; zCls = "running-text"; }
                    else if (ziel - jetzt < 86400000) { cCls = "card-urgent"; zCls = "urgent-text"; }
                } else { sTxt = "Status"; zStr = "FÄLLIG"; cCls = "card-urgent"; zCls = "faellig"; }

                const dOpt = { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' };
                const zeitInfo = (start ? "Start: " + start.toLocaleString('de-DE', dOpt) + "<br>" : "") + "Ende: " + ziel.toLocaleString('de-DE', dOpt);

                html += `<div class="termin-card ${cCls}"><div class="card-header"><div class="termin-info"><div class="termin-name">${t.name}</div>` +
                        `<div class="tag-container">${(t.tags || []).map(tg => `<span class="tag-badge">${tg}</span>`).join('')}</div>` +
                        `<div class="termin-datum">${zeitInfo}</div></div>` +
                        `<div class="zeit-box"><span class="status-label">${sTxt}</span><div class="zeit ${zCls}">${zStr}</div></div></div>` +
                        `${t.notiz ? `<div class="notiz-text">${formatNotiz(t.notiz)}</div>` : ""}</div>`;
            });
            document.getElementById('liste').innerHTML = html;
        }
        holeDaten(); setInterval(holeDaten, 30000);
    </script>
</body>
</html>
