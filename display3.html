<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Monitor - Color E-Ink (View Only)</title>
    <style>
        body { 
            background-color: white; 
            color: black; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            margin: 0; 
        }

        h1 { 
            border-bottom: 6px solid #00cae3; 
            padding-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            text-align: center;
            font-size: 2.5em;
            color: black;
            margin-top: 0;
        }
        
        .termin-counter { 
            text-align: right; 
            font-weight: bold; 
            color: #00cae3;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .termin-card { 
            border: 3px solid black;
            margin: 15px 0; 
            padding: 15px; 
            background-color: #fdfdfd;
            display: block; 
        }

        .card-urgent { border-color: #ff4d4d; background-color: #fffafa; border-width: 5px; }
        .card-running { border-color: #ffcc00; background-color: #fffff0; }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        
        .termin-info { flex: 1; }
        .termin-name { font-size: 1.8em; font-weight: bold; color: black; margin-bottom: 5px; }
        
        .tag-container { display: flex; gap: 6px; margin: 5px 0 10px 0; flex-wrap: wrap; }
        .tag-badge { 
            border: 1px solid black; 
            background-color: #e0faff; 
            color: black; 
            padding: 2px 8px; 
            font-size: 0.8em; 
            font-weight: bold; 
            text-transform: uppercase;
        }

        .termin-datum { font-size: 1.1em; color: #222; line-height: 1.4; font-weight: 500; }

        .notiz-text { 
            margin-top: 10px; 
            font-size: 1.1em; 
            border-top: 2px solid #00cae3; 
            padding-top: 8px;
            white-space: pre-wrap;
            color: #333;
            line-height: 1.4;
        }

        .cb-line { display: block; padding: 3px 0; font-weight: 500; }
        .cb-line.done { text-decoration: line-through; color: #888; }
        
        .zeit-box { text-align: right; min-width: 170px; }
        .status-label { display: block; font-size: 0.8em; text-transform: uppercase; font-weight: bold; color: #666; }
        .zeit { 
            font-family: 'Courier New', monospace; 
            font-size: 2em; 
            font-weight: bold; 
            color: #00cae3;
            white-space: nowrap;
        }

        .faellig { color: #ff4d4d !important; text-transform: uppercase; }
        .urgent-text { color: #ff4d4d !important; }
        .running-text { color: #ffcc00 !important; }
    </style>
</head>
<body>

    <h1>Termin Monitor</h1>
    <div id="counter-display" class="termin-counter">Synchronisiere...</div>
    <div id="liste">Lade Daten aus Orbit...</div>

    <script>
        const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
        const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
        const GITHUB_TOKEN = t1 + t2;
        const GITHUB_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';

        let termineDaten = [];

        async function holeDaten() {
            try {
                const response = await fetch(GITHUB_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: "no-store"
                });
                if (response.ok) {
                    const data = await response.json();
                    const str = atob(data.content);
                    const bytes = new Uint8Array(str.length);
                    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
                    termineDaten = JSON.parse(new TextDecoder().decode(bytes));
                    updateAnzeige();
                }
            } catch (e) { 
                document.getElementById('liste').innerHTML = "Fehler beim Laden der Daten.";
            }
        }

        function getCountdownStr(ms) {
            if (ms <= 0) return "FÄLLIG";
            
            const d = Math.floor(ms / 86400000);
            const h = Math.floor((ms % 86400000) / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);

            let parts = [];
            if (d > 0) parts.push(d + "t");
            if (h > 0) parts.push(h + "std");
            if (m > 0 || (d === 0 && h === 0)) parts.push(m + "min");

            return parts.join(" ");
        }

        function formatNotiz(txt) {
            if (!txt) return "";
            return txt.split('\n').map(line => {
                if (line.startsWith('[ ]')) return '<span class="cb-line">☐ ' + line.slice(3) + '</span>';
                if (line.startsWith('[x]')) return '<span class="cb-line done">☑ ' + line.slice(3) + '</span>';
                return line;
            }).join('\n')
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/--(.*?)--/g, '<s>$1</s>')
            .replace(/\[color:(.*?)\](.*?)\[\/color\]/g, '<span style="color:$1">$2</span>');
        }

        function updateAnzeige() {
            const listeDiv = document.getElementById('liste');
            const counterDiv = document.getElementById('counter-display');
            const jetzt = new Date();

            const sichtbareTermine = termineDaten.filter(t => !t.tags || !t.tags.includes("ARCHIV"));
            counterDiv.innerText = "AKTIVE TERMINE: " + sichtbareTermine.length;

            sichtbareTermine.sort((a, b) => {
                const zielA = new Date(a.ziel), startA = a.start ? new Date(a.start) : null;
                const zielB = new Date(b.ziel), startB = b.start ? new Date(b.start) : null;
                const relA = (startA && jetzt < startA) ? startA : zielA;
                const relB = (startB && jetzt < startB) ? startB : zielB;
                return relA - relB;
            });

            let html = "";
            sichtbareTermine.forEach((t) => {
                const ziel = new Date(t.ziel);
                const start = t.start ? new Date(t.start) : null;
                let zeitStr = "", statusText = "", cardClass = "", zeitClass = "";

                if (start && jetzt < start) {
                    statusText = "Startet"; zeitStr = getCountdownStr(start - jetzt);
                } else if (jetzt < ziel) {
                    statusText = start ? "Endet" : ""; zeitStr = getCountdownStr(ziel - jetzt);
                    if (start) { cardClass = "card-running"; zeitClass = "running-text"; }
                    else if (ziel - jetzt < 86400000) { cardClass = "card-urgent"; zeitClass = "urgent-text"; }
                } else {
                    statusText = "Status"; zeitStr = "FÄLLIG"; cardClass = "card-urgent"; zeitClass = "faellig";
                }
                
                let tagsHtml = t.tags && t.tags.length > 0 ? 
                    '<div class="tag-container">' + t.tags.map(tag => '<span class="tag-badge">' + tag + '</span>').join('') + '</div>' : "";

                const opt = { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' };
                const startHtml = start ? "Start: " + start.toLocaleString('de-DE', opt) + " Uhr<br>" : "";
                const zielHtml = "Ende: " + ziel.toLocaleString('de-DE', opt) + " Uhr";
                const notizHtml = t.notiz ? '<div class="notiz-text">' + formatNotiz(t.notiz) + '</div>' : "";

                html += '<div class="termin-card ' + cardClass + '">' +
                            '<div class="card-header">' +
                                '<div class="termin-info">' +
                                    '<div class="termin-name">' + t.name + '</div>' +
                                    tagsHtml +
                                    '<div class="termin-datum">' + startHtml + zielHtml + '</div>' +
                                '</div>' +
                                '<div class="zeit-box">' +
                                    '<span class="status-label">' + statusText + '</span>' +
                                    '<div class="zeit ' + zeitClass + '">' + zeitStr + '</div>' +
                                '</div>' +
                            '</div>' +
                            notizHtml +
                        '</div>';
            });
            listeDiv.innerHTML = html || "<p style='text-align:center;'>Keine aktuellen Termine.</p>";
        }

        holeDaten();
        setInterval(holeDaten, 30000); 
        setInterval(updateAnzeige, 30000); 
    </script>
</body>
</html>
