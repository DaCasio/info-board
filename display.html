<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Monitor - Color E-Ink (View Only)</title>
    <style>
        body { 
            background-color: white; 
            color: black; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            margin: 0; 
        }

        h1 { 
            border-bottom: 6px solid #00cae3; 
            padding-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            text-align: center;
            font-size: 2.5em;
            color: black;
            margin-top: 0;
        }
        
        .termin-counter { 
            text-align: right; 
            font-weight: bold; 
            color: #00cae3;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .termin-card { 
            border: 3px solid black;
            margin: 15px 0; 
            padding: 15px; 
            background-color: #fdfdfd;
            display: flex;
            flex-direction: column;
        }

        /* Spezialfarben für E-Ink (High Contrast) */
        .termin-card.live { border: 6px solid #ff4d4d; background-color: #fffafa; }
        .termin-card.faellig { border: 6px solid #ff4d4d; }

        .card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .termin-info { flex: 1; }
        .termin-name { font-size: 1.8em; font-weight: 900; margin-bottom: 5px; line-height: 1.1; }
        
        .tag-container { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .tag { 
            font-size: 0.9em; 
            background-color: #eeeeee; 
            color: black; 
            padding: 2px 10px; 
            border: 1px solid black;
            text-transform: uppercase;
            font-weight: bold;
        }

        .termin-datum { font-size: 1.1em; color: #444; font-weight: bold; }

        .zeit-box { text-align: right; min-width: 180px; }
        .status-label { font-size: 0.9em; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 2px; }
        .zeit { font-family: 'Courier New', monospace; font-size: 1.6em; font-weight: 900; }
        
        /* Countdown Farben */
        .zeit.laufend { color: #ffcc00; } /* Gold/Gelb */
        .zeit.kritisch { color: #ff4d4d; } /* Rot */

        .notiz-text { 
            margin-top: 12px; 
            font-size: 1.2em; 
            line-height: 1.4; 
            color: black; 
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Checklist Styles */
        .checklist-display { margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px; }
        .cb-line { display: flex; align-items: center; gap: 10px; font-size: 1.1em; margin-bottom: 4px; }
        .cb-line.done { text-decoration: line-through; color: #888; }
        .cb-box { font-weight: bold; font-size: 1.2em; }

        @media (max-width: 800px) {
            .card-header { flex-direction: column; }
            .zeit-box { text-align: left; margin-top: 15px; }
        }
    </style>
</head>
<body>

    <h1 id="clock">TERMIN MONITOR</h1>
    <div id="counter" class="termin-counter">Lade Orbit-Daten...</div>
    <div id="liste"></div>

    <script>
        const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
        const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
        const G_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';
        
        let data = [];

        function formatNotiz(txt) {
            if(!txt) return "";
            return txt
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\/\/(.*?)\/\//g, '<i>$1</i>')
                .replace(/__(.*?)__/g, '<u>$1</u>')
                .replace(/--(.*?)--/g, '<s>$1</s>')
                .replace(/\[color:(.*?)\](.*?)\[\/color\]/g, '<span style="color:$1">$2</span>');
        }

        async function holeDaten() {
            try {
                const res = await fetch(G_URL, { 
                    headers: { 'Authorization': `token ${t1+t2}` },
                    cache: "no-store" 
                });
                if(res.ok) {
                    const json = await res.json();
                    const content = decodeURIComponent(escape(atob(json.content)));
                    data = JSON.parse(content);
                    updateAnzeige();
                }
            } catch(e) { console.error("Sync-Fehler", e); }
        }

        function getCountdown(ms) {
            if (ms < 0) return "00d 00:00";
            const d = Math.floor(ms/86400000).toString().padStart(2,'0');
            const hh = Math.floor((ms%86400000)/3600000).toString().padStart(2,'0');
            const mm = Math.floor((ms%3600000)/60000).toString().padStart(2,'0');
            return `${d}d ${hh}:${mm}`;
        }

        function updateAnzeige() {
            const listeDiv = document.getElementById('liste');
            const counterDiv = document.getElementById('counter');
            const jetzt = new Date();

            // Filtern: Kein ARCHIV, Sortiert nach Fälligkeit
            let active = data.filter(t => !t.tags || !t.tags.includes("ARCHIV"));
            active.sort((a,b) => new Date(a.ziel) - new Date(b.ziel));

            counterDiv.innerText = "AKTIVE TERMINE IM ORBIT: " + active.length;

            let html = "";
            active.forEach(t => {
                const ziel = new Date(t.ziel);
                const start = t.start ? new Date(t.start) : null;
                
                let cardClass = "";
                let zeitStr = "";
                let statusText = "";
                let zeitClass = "";

                if (jetzt > ziel) {
                    cardClass = "faellig";
                    zeitStr = "FÄLLIG";
                    statusText = "STATUS";
                } else if (start && jetzt >= start && jetzt <= ziel) {
                    cardClass = "live";
                    statusText = "ENDE IN";
                    zeitStr = getCountdown(ziel - jetzt);
                    zeitClass = "laufend";
                } else if (start && jetzt < start) {
                    statusText = "START IN";
                    zeitStr = getCountdown(start - jetzt);
                } else {
                    statusText = "FÄLLIG IN";
                    zeitStr = getCountdown(ziel - jetzt);
                }

                const tagsHtml = t.tags ? '<div class="tag-container">' + t.tags.map(tag => '<span class="tag">' + tag + '</span>').join('') + '</div>' : "";
                const repeatIcon = (t.repeat && t.repeat !== "none") ? "🔄 " : "";
                
                // Datum Formatierung
                const opt = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                const startHtml = start ? "Start: " + start.toLocaleString('de-DE', opt) + " Uhr<br>" : "";
                const zielHtml = "Ende: " + ziel.toLocaleString('de-DE', opt) + " Uhr";
                
                // Notiz & Checkliste
                const notizHtml = t.notiz ? '<div class="notiz-text">' + formatNotiz(t.notiz) + '</div>' : "";
                
                let checklistHtml = "";
                if (t.checklist && t.checklist.length > 0) {
                    checklistHtml = '<div class="checklist-display">';
                    t.checklist.forEach(item => {
                        checklistHtml += `
                            <div class="cb-line ${item.done ? 'done' : ''}">
                                <span class="cb-box">${item.done ? '☑' : '☐'}</span>
                                <span>${item.text}</span>
                            </div>`;
                    });
                    checklistHtml += '</div>';
                }

                html += '<div class="termin-card ' + cardClass + '">' +
                            '<div class="card-header">' +
                                '<div class="termin-info">' +
                                    '<div class="termin-name">' + repeatIcon + t.name + '</div>' +
                                    tagsHtml +
                                    '<div class="termin-datum">' + startHtml + zielHtml + '</div>' +
                                '</div>' +
                                '<div class="zeit-box">' +
                                    '<span class="status-label">' + statusText + '</span>' +
                                    '<div class="zeit ' + zeitClass + '">' + zeitStr + '</div>' +
                                '</div>' +
                            '</div>' +
                            notizHtml +
                            checklistHtml +
                        '</div>';
            });

            listeDiv.innerHTML = html || "<p style='text-align:center;'>Keine aktuellen Termine.</p>";
        }

        holeDaten();
        // Aktualisierung alle 60 Sekunden für E-Ink Schonung
        setInterval(holeDaten, 60000); 
        setInterval(updateAnzeige, 60000); 
    </script>
</body>
</html>
