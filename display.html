<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Monitor - Color E-Ink (View Only)</title>
    <style>
        body {
            background-color: white;
            color: black;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        h1 {
            border-bottom: 6px solid #00cae3;
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            font-size: 2.5em;
            color: black;
            margin-top: 0;
        }

        .termin-counter {
            text-align: right;
            font-weight: bold;
            color: #00cae3;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        /* NEU: Minimalistischer Trenner beim Wechsel zu einem anderen Termin-Tag */
        .tag-separator {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0 14px;
            color: #00a9be;
            font-size: 0.95em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tag-separator::before,
        .tag-separator::after {
            content: '';
            height: 2px;
            flex: 1;
            background-color: #00cae3;
        }

        .tag-separator.today {
            color: #8a6b00;
        }

        .tag-separator.today::before,
        .tag-separator.today::after {
            background-color: #ffcc00;
        }

        .termin-card {
            border: 3px solid black;
            margin: 15px 0;
            padding: 15px;
            background-color: #fdfdfd;
            display: block;
        }

        .card-urgent { border-color: #ff4d4d; background-color: #fffafa; }
        .card-running { border-color: #ffcc00; background-color: #fffff0; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 20px; }

        .termin-info { flex: 1; }
        .termin-name { font-size: 1.6em; font-weight: bold; color: black; margin-bottom: 5px; }

        .tag-container { display: flex; gap: 6px; margin: 5px 0 10px 0; flex-wrap: wrap; }
        .tag-badge {
            border: 1px solid black;
            background-color: #e0faff;
            color: black;
            padding: 1px 6px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
        }
        .repeat-badge {
            background-color: #eee;
            border-color: #888;
            color: #555;
        }

        .termin-datum { font-size: 1.05em; color: #444; line-height: 1.4; font-weight: 500; }

        .notiz-text {
            margin-top: 10px;
            font-size: 1.1em;
            border-top: 2px solid #00cae3;
            padding-top: 8px;
            white-space: pre-wrap;
            color: #333;
            line-height: 1.4;
        }

        .checklist-display { margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px; }
        .cb-line { display: block; padding: 2px 0; font-weight: 500; }
        .cb-line.done { text-decoration: line-through; color: #888; }

        .zeit-box { text-align: right; min-width: 200px; }
        .status-label { display: block; font-size: 0.75em; text-transform: uppercase; font-weight: bold; color: #666; }
        .zeit {
            font-family: 'Courier New', monospace;
            font-size: 1.8em;
            font-weight: bold;
            color: #00cae3;
            white-space: nowrap;
        }
        .zeit-monate {
            margin-top: 6px;
            font-size: 0.9em;
            font-weight: bold;
            color: #666;
            white-space: nowrap;
        }

        /* NEU: Laufende Anzeige seit dem Fälligkeitszeitpunkt */
        .zeit-ueberfaellig {
            margin-top: 6px;
            padding-top: 5px;
            border-top: 1px solid #ffb3b3;
            font-size: 0.78em;
            font-weight: bold;
            color: #b30000;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .faellig { color: #ff4d4d !important; text-transform: uppercase; }
        .urgent-text { color: #ff4d4d !important; }
        .running-text { color: #ffcc00 !important; }
    </style>
</head>
<body>

    <h1>Termin Monitor</h1>
    <div id="counter-display" class="termin-counter">Termine: 0</div>
    <div id="liste">Lade Daten aus Orbit...</div>

    <script>
        const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
        const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
        const GITHUB_TOKEN = t1 + t2;
        const GITHUB_URL = 'https://api.github.com/repos/dacasio/info-board/contents/termine.json';

        let termineDaten = [];

        async function holeDaten() {
            try {
                const response = await fetch(GITHUB_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-store'
                });
                if (response.ok) {
                    const data = await response.json();
                    const str = atob(data.content);
                    const bytes = new Uint8Array(str.length);
                    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
                    termineDaten = JSON.parse(new TextDecoder().decode(bytes));
                    updateAnzeige();
                }
            } catch (e) {
                document.getElementById('liste').innerHTML = 'Fehler beim Laden der Daten.';
            }
        }

        function getCountdownStr(ms) {
            if (ms < 0) return 'Fällig';
            const d = Math.floor(ms / 86400000).toString().padStart(2, '0');
            const h = Math.floor((ms % 86400000) / 3600000).toString().padStart(2, '0');
            const m = Math.floor((ms % 3600000) / 60000).toString().padStart(2, '0');
            return d + 'd ' + h + 'h ' + m + 'm';
        }

        function addMonthsSafe(date, months) {
            const result = new Date(date.getTime());
            const originalDay = result.getDate();
            result.setDate(1);
            result.setMonth(result.getMonth() + months);
            const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
            result.setDate(Math.min(originalDay, lastDay));
            return result;
        }

        function getMonthDayDiff(from, to) {
            if (to <= from) return '0 Monate 0 Tage';

            let months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
            let anchor = addMonthsSafe(from, months);

            if (anchor > to) {
                months--;
                anchor = addMonthsSafe(from, months);
            }

            const restMs = to - anchor;
            const days = Math.floor(restMs / 86400000);
            return months + ' Monate ' + days + ' Tage';
        }

        /* NEU: Tagesvergleich und Beschriftung für die Anzeige-Trenner */
        function getDayKey(date) {
            const d = new Date(date);
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        function getDaySeparatorLabel(date, heute) {
            const d = new Date(date);
            if (getDayKey(d) === getDayKey(heute)) {
                return 'HEUTE · ' + d.toLocaleDateString('de-DE', {
                    weekday: 'long',
                    day: '2-digit',
                    month: 'long'
                });
            }
            return d.toLocaleDateString('de-DE', {
                weekday: 'long',
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            });
        }

        function formatNotiz(txt) {
            if (!txt) return '';
            let formatted = txt.split('\n').map(line => {
                if (line.trim().startsWith('[ ]')) return '<span class="cb-line">☐ ' + line.trim().slice(3) + '</span>';
                if (line.trim().startsWith('[x]')) return '<span class="cb-line done">☑ ' + line.trim().slice(3) + '</span>';
                return line;
            }).join('\n');

            return formatted
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\/\/(.*?)\/\//g, '<i>$1</i>')
                .replace(/__(.*?)__/g, '<u>$1</u>')
                .replace(/--(.*?)--/g, '<s>$1</s>')
                .replace(/\[color:(.*?)\](.*?)\[\/color\]/g, '<span style="color:$1">$2</span>');
        }

        function updateAnzeige() {
            const listeDiv = document.getElementById('liste');
            const counterDiv = document.getElementById('counter-display');
            const jetzt = new Date();

            const sichtbareTermine = termineDaten.filter(t => !t.tags || !t.tags.includes('ARCHIV'));
            counterDiv.innerText = 'AKTIVE TERMINE: ' + sichtbareTermine.length;

            sichtbareTermine.sort((a, b) => {
                const now = new Date();
                const timeA = (a.start && now < new Date(a.start)) ? new Date(a.start) : new Date(a.ziel);
                const timeB = (b.start && now < new Date(b.start)) ? new Date(b.start) : new Date(b.ziel);
                return timeA - timeB;
            });

            let html = '';
            let previousDayKey = '';
            sichtbareTermine.forEach((t) => {
                const ziel = new Date(t.ziel);
                const start = t.start ? new Date(t.start) : null;
                const targetDate = (start && jetzt < start) ? start : ziel;
                const currentDayKey = getDayKey(targetDate);
                let zeitStr = '', statusText = '', cardClass = '', zeitClass = '', monateStr = '', ueberfaelligStr = '';

                /* NEU: Trenner nur beim Wechsel des relevanten Termin-Tages */
                if (currentDayKey !== previousDayKey) {
                    const isToday = currentDayKey === getDayKey(jetzt);
                    html += '<div class="tag-separator ' + (isToday ? 'today' : '') + '">' +
                                '<span>' + getDaySeparatorLabel(targetDate, jetzt) + '</span>' +
                            '</div>';
                    previousDayKey = currentDayKey;
                }

                if (start && jetzt < start) {
                    statusText = 'Start in';
                    zeitStr = getCountdownStr(start - jetzt);
                    monateStr = getMonthDayDiff(jetzt, start);
                } else if (jetzt < ziel) {
                    statusText = start ? 'Ende in' : '';
                    zeitStr = getCountdownStr(ziel - jetzt);
                    monateStr = getMonthDayDiff(jetzt, ziel);
                    if (start) {
                        cardClass = 'card-running';
                        zeitClass = 'running-text';
                        statusText = 'Ende in';
                    } else if (ziel - jetzt < 86400000) {
                        cardClass = 'card-urgent';
                        zeitClass = 'urgent-text';
                    }
                } else {
                    statusText = 'Status';
                    zeitStr = 'Fällig';
                    monateStr = '0 Monate 0 Tage';
                    ueberfaelligStr = 'Überfällig seit ' + getCountdownStr(jetzt - ziel);
                    cardClass = 'card-urgent';
                    zeitClass = 'faellig';
                }

                let repeatBadge = '';
                let repeatIcon = '';
                if (t.repeat && t.repeat !== 'none') {
                    repeatIcon = '🔄 ';
                    repeatBadge = '<span class="tag-badge repeat-badge">Serien: ' + t.repeat + '</span>';
                }

                let tagsHtml = '';
                if ((t.tags && t.tags.length > 0) || repeatBadge !== '') {
                    tagsHtml = '<div class="tag-container">' +
                        (t.tags ? t.tags.map(tag => '<span class="tag-badge">' + tag + '</span>').join('') : '') +
                        repeatBadge +
                        '</div>';
                }

                const opt = { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                const startHtml = start ? 'Start: ' + start.toLocaleString('de-DE', opt) + ' Uhr<br>' : '';
                const zielHtml = 'Ende: ' + ziel.toLocaleString('de-DE', opt) + ' Uhr';
                const notizHtml = t.notiz ? '<div class="notiz-text">' + formatNotiz(t.notiz) + '</div>' : '';
                const ueberfaelligHtml = ueberfaelligStr ? '<div class="zeit-ueberfaellig">' + ueberfaelligStr + '</div>' : '';

                let checklistHtml = '';
                if (t.checklist && t.checklist.length > 0) {
                    checklistHtml = '<div class="checklist-display">';
                    t.checklist.forEach(item => {
                        checklistHtml += '<div class="cb-line ' + (item.done ? 'done' : '') + '"><span>' + (item.done ? '☑' : '☐') + ' ' + item.text + '</span></div>';
                    });
                    checklistHtml += '</div>';
                }

                html += '<div class="termin-card ' + cardClass + '">' +
                            '<div class="card-header">' +
                                '<div class="termin-info">' +
                                    '<div class="termin-name">' + repeatIcon + t.name + '</div>' +
                                    tagsHtml +
                                    '<div class="termin-datum">' + startHtml + zielHtml + '</div>' +
                                '</div>' +
                                '<div class="zeit-box">' +
                                    '<span class="status-label">' + statusText + '</span>' +
                                    '<div class="zeit ' + zeitClass + '">' + zeitStr + '</div>' +
                                    '<div class="zeit-monate">' + monateStr + '</div>' +
                                    ueberfaelligHtml +
                                '</div>' +
                            '</div>' +
                            notizHtml +
                            checklistHtml +
                        '</div>';
            });
            listeDiv.innerHTML = html || "<p style='text-align:center;'>Keine aktuellen Termine.</p>";
        }

        holeDaten();
        setInterval(holeDaten, 60000);
        setInterval(updateAnzeige, 60000);
    </script>
</body>
</html>
