<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Display - Orbital Monitor</title>
    <style>
        :root { --accent: #00cae3; --bg-overlay: rgba(0, 0, 0, 0.8); --live-color: #ffcc00; }
        
        body { 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images-assets.nasa.gov/image/PIA08653/PIA08653~medium.jpg');
            background-size: cover; background-attachment: fixed; background-position: center;
            color: white; font-family: 'Segoe UI', sans-serif; 
            padding: 20px; margin: 0; min-height: 100vh;
        }

        .display-container { max-width: 800px; margin: 0 auto; }
        
        .termin-card { 
            background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 202, 227, 0.4); border-radius: 12px; 
            padding: 20px; margin-bottom: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }
        
        .row-title { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .titel-box { font-size: 1.6em; font-weight: bold; flex: 1; }
        
        .tag-display { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tag-mini { font-size: 0.8em; background: rgba(0, 202, 227, 0.3); color: var(--accent); 
                    padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
        
        .row-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .datum-box { font-size: 1em; color: #ddd; line-height: 1.5; }
        .countdown-box { 
            background: rgba(0, 202, 227, 0.2); padding: 8px 16px; border-radius: 6px; 
            font-family: 'Courier New', monospace; font-weight: bold; color: var(--accent); 
            font-size: 1.4em; border: 2px solid rgba(0, 202, 227, 0.5); min-width: 160px; text-align: center;
        }
        
        .row-notiz { border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; margin-top: 15px; }
        .notiz-display { font-size: 1.1em; line-height: 1.6; color: #eee; white-space: pre-wrap; }
        
        .live { border-left: 6px solid var(--live-color) !important; }
        .faellig { color: #ff4d4d !important; background: rgba(255, 77, 77, 0.1) !important; border-color: #ff4d4d !important; }
        .laufend { color: var(--live-color) !important; background: rgba(255, 204, 0, 0.1) !important; border-color: var(--live-color) !important; }
        
        .status-bar { text-align: center; font-size: 0.9em; color: #aaa; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .last-update { font-size: 0.7em; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="display-container">
        <h1 style="text-align: center; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 10px;">Orbital Monitor</h1>
        <div class="status-bar" id="status-bar">Lade Daten...</div>
        <div id="display-list"></div>
        <div class="last-update" id="last-update"></div>
    </div>

    <script>
        const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
        const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
        const G_URL = 'https://api.github.com/repos/DaCasio/info-board/contents/termine.json';
        let data = [], lastUpdate = new Date();

        // **KORRIGIERTE SORTIERLOGIK** - NEUE FUNKTION
        function getSortDate(t) {
            const now = new Date();
            const start = t.start ? new Date(t.start) : null;
            const end = new Date(t.ziel);
            
            // Wenn Startzeit existiert UND noch nicht verstrichen: Nach START sortieren
            if (start && now < start) {
                return start;
            }
            
            // Sonst nach ENDE sortieren (laufend/abgelaufen/ohne Start)
            return end;
        }

        function getCountdown(ms) {
            if (ms < 0) return "FÄLLIG";
            const d = Math.floor(ms / 86400000).toString().padStart(2, '0');
            const h = Math.floor((ms % 86400000) / 3600000).toString().padStart(2, '0');
            const m = Math.floor((ms % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
            return `${d}d ${h}:${m}:${s}`;
        }

        function updateDisplay() {
            const now = new Date();
            const status = document.getElementById('status-bar');
            const container = document.getElementById('display-list');
            const updateEl = document.getElementById('last-update');

            // **KORRIGIERTE SORTIERUNG** - Nach getSortDate()
            const sortedData = data
                .filter(t => !t.tags?.includes('ARCHIV'))
                .sort((a, b) => getSortDate(a) - getSortDate(b));

            status.textContent = `${sortedData.length} aktive Termine`;
            updateEl.textContent = `Letzte Synchronisation: ${lastUpdate.toLocaleString('de-DE')}`;

            if (sortedData.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#aaa; padding:40px;">Keine aktiven Termine</div>';
                return;
            }

            let html = '';
            sortedData.forEach(t => {
                const start = t.start ? new Date(t.start) : null;
                const end = new Date(t.ziel);
                const msToEnd = end - now;
                const msToStart = start ? start - now : 0;

                let statusClass = '', countdownText = '', statusText = '';
                
                if (start && now < start) {
                    // Noch nicht gestartet
                    statusClass = '';
                    countdownText = getCountdown(msToStart);
                    statusText = 'START IN';
                } else {
                    // Läuft oder fällig
                    if (msToEnd >= 0) {
                        statusClass = 'laufend';
                        countdownText = getCountdown(msToEnd);
                        statusText = 'ENDE IN';
                    } else {
                        statusClass = 'faellig';
                        countdownText = 'FÄLLIG';
                        statusText = '';
                    }
                }

                const tagsHtml = t.tags ? t.tags.map(tag => `<span class="tag-mini">${tag}</span>`).join('') : '';
                const repeatHtml = t.repeat && t.repeat !== 'none' ? `<span class="tag-mini">🔄 ${t.repeat}</span>` : '';

                html += `
                    <div class="termin-card ${statusClass} live">
                        <div class="row-title">
                            <div class="titel-box">${t.name}</div>
                        </div>
                        <div class="tag-display">${tagsHtml}${repeatHtml}</div>
                        <div class="row-info">
                            <div class="datum-box">
                                ${start ? `Start: ${start.toLocaleString('de-DE')}<br>` : ''}
                                Ende: ${end.toLocaleString('de-DE')}
                            </div>
                            <div class="countdown-box">
                                <small>${statusText}</small><br>${countdownText}
                            </div>
                        </div>
                        ${t.notiz ? `<div class="row-notiz"><div class="notiz-display">${t.notiz}</div></div>` : ''}
                    </div>`;
            });

            container.innerHTML = html;
        }

        async function loadData() {
            try {
                const res = await fetch(G_URL, { 
                    headers: { 'Authorization': `token ${t1+t2}` }, 
                    cache: 'no-store' 
                });
                if (res.ok) {
                    const json = await res.json();
                    data = JSON.parse(atob(json.content));
                    lastUpdate = new Date();
                    updateDisplay();
                }
            } catch (e) {
                document.getElementById('status-bar').textContent = 'Fehler beim Laden';
                console.error(e);
            }
        }

        // Alle 30 Sekunden aktualisieren
        setInterval(loadData, 30000);
        loadData(); // Initial laden
    </script>
</body>
</html>
