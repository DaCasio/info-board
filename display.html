<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin Display - Orbital Monitor</title>
    <style>
        :root { 
            --accent: #00cae3; 
            --bg-overlay: rgba(0, 0, 0, 0.8); 
            --live-color: #ffcc00; 
            --urgent-color: #ff4d4d;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images-assets.nasa.gov/image/PIA08653/PIA08653~medium.jpg');
            background-size: cover; background-attachment: fixed; background-position: center;
            color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; min-height: 100vh;
        }
        
        .container {
            max-width: 800px; margin: 0 auto; position: relative;
        }
        
        h1 {
            text-align: center; text-transform: uppercase; letter-spacing: 4px; 
            margin-bottom: 30px; font-size: 2em; text-shadow: 0 0 20px rgba(0,202,227,0.8);
        }
        
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; margin-bottom: 25px;
        }
        
        .stat-card {
            background: rgba(20,20,20,0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(0,202,227,0.4); border-radius: 12px; padding: 20px;
            text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        .stat-number { font-size: 2.5em; font-weight: bold; margin-bottom: 5px; }
        .stat-label { font-size: 0.9em; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-urgent { color: var(--urgent-color); }
        .stat-live { color: var(--live-color); }
        
        .termin-list {
            display: flex; flex-direction: column; gap: 15px;
        }
        
        .termin-card {
            background: rgba(30,30,30,0.95); backdrop-filter: blur(12px);
            border-left: 6px solid var(--accent); border-radius: 12px; padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: all 0.3s;
            animation: slideIn 0.5s ease-out;
        }
        
        .termin-card.laufend { border-left-color: var(--live-color); }
        .termin-card.faellig { border-left-color: var(--urgent-color); animation: pulse 2s infinite; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } }
        @keyframes pulse { 0%,100% { box-shadow: 0 10px 40px rgba(255,77,77,0.3); } 50% { box-shadow: 0 10px 60px rgba(255,77,77,0.6); } }
        
        .termin-header {
            display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;
        }
        
        .titel { 
            font-size: 1.4em; font-weight: bold; flex: 1; margin-right: 15px; 
        }
        
        .countdown {
            background: rgba(0,202,227,0.2); padding: 8px 16px; border-radius: 8px;
            font-family: 'Courier New', monospace; font-weight: bold; font-size: 1.1em;
            border: 1px solid rgba(0,202,227,0.5); min-width: 160px; text-align: center;
        }
        
        .countdown.laufend { background: rgba(255,204,0,0.2); border-color: rgba(255,204,0,0.5); color: var(--live-color); }
        .countdown.faellig { background: rgba(255,77,77,0.2); border-color: rgba(255,77,77,0.5); color: var(--urgent-color); }
        
        .timeline {
            display: flex; gap: 20px; margin-bottom: 12px; font-size: 0.9em; color: #ccc;
        }
        
        .timeline-item { text-align: center; position: relative; }
        .timeline-item:not(:last-child)::after {
            content: ''; position: absolute; top: 50%; right: -12px; width: 20px; height: 2px;
            background: linear-gradient(to right, #666, transparent);
        }
        
        .tags { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tag {
            background: rgba(0,202,227,0.2); color: var(--accent); padding: 4px 12px;
            border-radius: 20px; font-size: 0.8em; font-weight: bold; border: 1px solid rgba(0,202,227,0.3);
        }
        
        .notiz {
            line-height: 1.5; background: rgba(255,255,255,0.05); padding: 15px; 
            border-radius: 8px; border-left: 4px solid var(--accent); white-space: pre-wrap;
        }
        
        .empty-state {
            text-align: center; padding: 60px 20px; color: #888;
            font-size: 1.2em; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        
        .last-update {
            position: absolute; top: 10px; right: 10px; font-size: 0.8em; color: #888;
            background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="last-update" id="last-update"></div>
        <h1>Orbital Mission Control</h1>
        
        <div class="stats" id="stats">
            <!-- Dynamisch gefüllt -->
        </div>
        
        <div class="termin-list" id="termin-list">
            <!-- Dynamisch gefüllt -->
        </div>
        
        <div class="empty-state" id="empty-state" style="display: none;">
            🚀 Alle Missionen abgeschlossen<br>
            Nächste Termine werden automatisch aktualisiert
        </div>
    </div>

    <script>
        const G_URL = 'https://api.github.com/repos/DaCasio/info-board/contents/termine.json';
        const t1 = "github_pat_11BBRVHCQ05kX9OEirDuF2";
        const t2 = "_SfPbmFFMu5S4O8kX6AdanuVfPsNY6k84nVv35qdNOgAV5OKWJ5NnW3tS9qH";
        
        let data = [], lastUpdate = "";
        
        // NEUE SORTIERFUNKTION: Start vor End, wenn Start noch nicht erreicht
        function getSortDate(t) {
            const now = new Date();
            const start = t.start ? new Date(t.start) : null;
            const end = new Date(t.ziel);
            
            // Wenn Start existiert UND noch nicht erreicht -> nach START sortieren
            if (start && now < start) {
                return start;
            }
            
            // Sonst nach ENDE sortieren (laufend/abgelaufen/ohne Start)
            return end;
        }
        
        function getStatus(t) {
            const now = new Date();
            const start = t.start ? new Date(t.start) : now;
            const end = new Date(t.ziel);
            
            if (now < start) return { text: "START IN", class: "" };
            if (now < end) return { text: "ENDE IN", class: "laufend" };
            return { text: "ABGELAUFEN", class: "faellig" };
        }
        
        function formatDateTime(dateStr) {
            return new Date(dateStr).toLocaleString('de-DE', {
                weekday: 'short', day: '2-digit', month: 'short',
                hour: '2-digit', minute: '2-digit'
            });
        }
        
        function getCountdown(ms) {
            if (ms < 0) return "ABGELAUFEN";
            const days = Math.floor(ms / 86400000);
            const hours = Math.floor((ms % 86400000) / 3600000);
            const minutes = Math.floor((ms % 3600000) / 60000);
            return `${days > 0 ? days + 'd ' : ''}${hours}:${minutes.toString().padStart(2,'0')}`;
        }
        
        async function loadData() {
            try {
                const res = await fetch(G_URL, { 
                    headers: { 'Authorization': `token ${t1+t2}` },
                    cache: "no-store"
                });
                if (res.ok) {
                    const json = await res.json();
                    data = JSON.parse(atob(json.content));
                    render();
                }
            } catch(e) {
                console.error("Laden fehlgeschlagen:", e);
            }
        }
        
        function render() {
            lastUpdate = new Date().toLocaleString('de-DE');
            document.getElementById('last-update').textContent = `Letzte Sync: ${lastUpdate}`;
            
            // Filter: Nur nicht-archivierte Termine
            const active = data.filter(t => !t.tags?.includes("ARCHIV"));
            
            if (active.length === 0) {
                document.getElementById('stats').style.display = 'none';
                document.getElementById('termin-list').style.display = 'none';
                document.getElementById('empty-state').style.display = 'block';
                return;
            }
            
            // SORTIERUNG: Nach dynamischem Start/End-Datum
            active.sort((a, b) => getSortDate(a) - getSortDate(b));
            
            // Stats berechnen
            const stats = {
                total: active.length,
                live: active.filter(t => {
                    const now = new Date();
                    return t.start && now >= new Date(t.start) && now < new Date(t.ziel);
                }).length,
                urgent: active.filter(t => new Date(t.ziel) < new Date()).length
            };
            
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${stats.total}</div>
                    <div class="stat-label">Aktive Missionen</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number live">${stats.live}</div>
                    <div class="stat-label">Aktuell laufend</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number urgent">${stats.urgent}</div>
                    <div class="stat-label">Fällig/Überfällig</div>
                </div>
            `;
            
            // Termine rendern
            let html = '';
            active.forEach(t => {
                const start = t.start ? new Date(t.start) : null;
                const end = new Date(t.ziel);
                const now = new Date();
                const status = getStatus(t);
                const msToEnd = end - now;
                const msToStart = start ? start - now : 0;
                
                html += `
                    <div class="termin-card ${status.class}">
                        <div class="termin-header">
                            <div class="titel">${t.name}</div>
                            <div class="countdown ${status.class}" data-ms="${msToEnd}">
                                <small>${status.text}</small>
                                ${getCountdown(Math.min(msToEnd, msToStart))}
                            </div>
                        </div>
                        <div class="timeline">
                            ${start ? `<div class="timeline-item">Start<br>${formatDateTime(start)}</div>` : ''}
                            <div class="timeline-item">Ende<br>${formatDateTime(end)}</div>
                        </div>
                        ${t.tags ? `<div class="tags">${t.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>` : ''}
                        ${t.notiz ? `<div class="notiz">${t.notiz}</div>` : ''}
                    </div>
                `;
            });
            
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('termin-list').innerHTML = html;
            document.getElementById('termin-list').style.display = 'flex';
            document.getElementById('empty-state').style.display = 'none';
            
            updateCountdowns();
        }
        
        function updateCountdowns() {
            const now = new Date();
            document.querySelectorAll('.countdown[data-ms]').forEach(el => {
                let ms = parseInt(el.dataset.ms);
                ms -= now - new Date(el.dataset.lastUpdate || now);
                el.dataset.ms = ms;
                const countdownText = getCountdown(ms);
                el.childNodes[1].textContent = countdownText;
            });
        }
        
        // Initiales Laden + Auto-Refresh alle 30 Sekunden
        loadData();
        setInterval(loadData, 30000);
        
        // Live Countdown-Update alle Sekunde
        setInterval(updateCountdowns, 1000);
    </script>
</body>
</html>
